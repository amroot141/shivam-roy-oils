name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run build

      - name: Deploy Firestore Rules
        run: npx -y firebase-tools@latest deploy --only firestore:rules --project shivam-roy-oils-pos
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_CI_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        # If FIREBASE_CI_TOKEN secret is set, firebase-tools uses it automatically.
        # To generate the token, run: npx firebase-tools@latest login:ci
        # Then add the output as a GitHub secret named FIREBASE_CI_TOKEN

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SHIVAM_ROY_OILS_POS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: shivam-roy-oils-pos
